<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Totem Autoatendimento - Impressão</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; user-select: none; }
        body {
            margin: 0; padding: 0; background-color: #121212; color: #ffffff;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; text-align: center;
        }
        .container {
            background: #1e1e1e; padding: 40px; border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5); width: 90%; max-width: 600px;
        }
        h1 { font-size: 2.2rem; margin-bottom: 10px; color: #00e676; }
        p { font-size: 1.2rem; color: #cccccc; margin-bottom: 30px; }
        .btn-grande {
            display: block; width: 100%; padding: 25px; margin: 15px 0;
            font-size: 1.5rem; font-weight: bold; color: #121212;
            background-color: #00e676; border: none; border-radius: 12px;
            cursor: pointer; transition: transform 0.1s, background 0.2s;
        }
        .btn-grande:active { transform: scale(0.98); background-color: #00c853; }
        .btn-secundario { background-color: #2979ff; color: #fff; }
        #inputArquivo { display: none; }
        
        /* Área oculta na tela, visível apenas na impressão */
        #area-impressao { display: none; }

        @media print {
            body * { visibility: hidden; }
            #area-impressao, #area-impressao * {
                visibility: visible; color: #000; background: #fff;
            }
            #area-impressao {
                display: block; position: absolute; left: 0; top: 0; width: 100%;
                text-align: center; padding: 20px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Autoatendimento</h1>
    <p>Selecione uma opção para iniciar a impressão</p>

    <!-- Opção 1: Gerar Senha / Comprovante Rápido -->
    <button class="btn-grande" onclick="imprimirSenha()">
        🎫 Retirar Senha / Comprovante
    </button>

    <!-- Opção 2: Selecionar PDF ou Imagem para Imprimir -->
    <button class="btn-grande btn-secundario" onclick="document.getElementById('inputArquivo').click()">
        📄 Selecionar Arquivo (PDF / Imagem)
    </button>
    <input type="file" id="inputArquivo" accept=".pdf,image/*" onchange="processarArquivo(event)">
</div>

<!-- Template de Impressão Térmica ou A4 -->
<div id="area-impressao">
    <h2>SENHA DE ATENDIMENTO</h2>
    <h1 id="numero-senha" style="font-size: 48px; margin: 10px 0;">A-001</h1>
    <p id="data-hora"></p>
    <hr>
    <p>Aguarde ser chamado no painel.</p>
</div>

<script>
    let contadorSenha = 1;

    function imprimirSenha() {
        const agora = new Date();
        const numeroFormatado = 'A-' + String(contadorSenha).padStart(3, '0');
        
        document.getElementById('numero-senha').innerText = numeroFormatado;
        document.getElementById('data-hora').innerText = agora.toLocaleString('pt-BR');
        
        contadorSenha++;
        window.print();
    }

    function processarArquivo(event) {
        const arquivo = event.target.files[0];
        if (!arquivo) return;

        const urlArquivo = URL.createObjectURL(arquivo);
        const janelaImpressao = window.open(urlArquivo, '_blank');
        
        janelaImpressao.onload = function() {
            janelaImpressao.print();
        };
    }
</script>

</body>
</html>
